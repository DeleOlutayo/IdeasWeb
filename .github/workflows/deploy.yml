name: Deploy to test.ideasclique.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stop before uploading if the FTP account opens somewhere other than the
      # test site's own folder, so the main website can't be overwritten.
      # Only a verdict is logged: this repo's Actions logs are public.
      - name: Check the FTP folder is safe to upload to
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os, re, ssl, sys

          user, password = os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"]
          print("username has surrounding whitespace:", user != user.strip())
          print("password has surrounding whitespace:", password != password.strip())
          print("username contains @:", "@" in user)

          conn = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30)
          conn.connect(os.environ["FTP_SERVER"], 21)
          conn.auth()
          try:
              conn.login(user, password)
          except ftplib.error_perm as e:
              sys.exit(f"::error::FTP login rejected: {e}")
          conn.prot_p()
          names = {name for name, _ in conn.mlsd()} - {".", ".."}
          conn.quit()

          risky = re.compile(r"public_html|www|mail|wp-config\.php|wp-admin|\.htaccess|index\.(html?|php)")
          if ".ftp-deploy-sync-state.json" in names:
              print("Previous deployment found in this folder: safe to update.")
          elif any(risky.fullmatch(n) for n in names):
              sys.exit("::error::The FTP account opens a folder that holds an existing site or account files. Nothing was uploaded. Set the account's directory to the test site's own folder.")
          else:
              print("Folder holds no existing site: safe for the first upload.")
          PY

      - name: Collect the site files
        run: |
          mkdir site
          cp index.html site/
          cp -R brand_assets site/

      - name: Upload over encrypted FTP
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./site/
          server-dir: ./
